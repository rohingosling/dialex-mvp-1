# Project: Dialex customer prototype
# Version: 1.0
# Date: 2026-09-09
# Author: Rohin Gosling
# Description: Publish the three browser assets to GitHub Pages.

name: Publish Dialex prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare the browser prototype
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dialex-pages"
          cp docs/presentations/dialex-prototype/index.html "$RUNNER_TEMP/dialex-pages/"
          cp docs/presentations/dialex-prototype/styles.css "$RUNNER_TEMP/dialex-pages/"
          cp docs/presentations/dialex-prototype/app.js "$RUNNER_TEMP/dialex-pages/"

      - name: Upload the browser prototype
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/dialex-pages

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
